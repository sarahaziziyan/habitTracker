<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage habits</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body>
  <header id="hdr"></header>
  <main>
    <div class="toolbar"><span id="pickers" class="toolbar" style="margin:0"></span></div>

    <div class="panel">
      <h2 data-i18n="category"></h2>
      <div class="form-row">
        <input id="catName" data-i18n-ph="category">
        <input id="catColor" type="color" value="#5b8def">
        <button class="primary" id="addCat" data-i18n="addCategory"></button>
      </div>
      <div id="catList"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="addHabit"></h2>
      <div class="form-row">
        <input id="habitTitle" data-i18n-ph="title">
        <select id="habitCat"></select>
        <button class="primary" id="addHabit" data-i18n="addHabit"></button>
      </div>
      <div id="habitMsg" class="msg"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="copyHabits"></h2>
      <div class="form-row">
        <label><span data-i18n="copyFrom"></span> <select id="fromMonth"></select> <select id="fromYear"></select></label>
        <span aria-hidden="true">&rarr;</span>
        <label><span data-i18n="copyTo"></span> <select id="toMonth"></select> <select id="toYear"></select></label>
        <button class="primary" id="copyGo" data-i18n="copyNow"></button>
      </div>
      <div id="copyMsg" class="msg"></div>
    </div>

    <div class="panel">
      <div class="msg" id="sortHint" style="margin:0 0 var(--space-3)"></div>
      <table>
        <thead id="habitHead"></thead>
        <tbody id="habitRows"></tbody>
      </table>
    </div>
  </main>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
  <script>
    document.getElementById('hdr').innerHTML = headerHtml();
    let ym = getYM();
    let categories = [];

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function catOptions(selectedId) {
      return '<option value="">' + t('noCategory') + '</option>' + categories.map(c =>
        '<option value="' + c.id + '"' + (c.id === selectedId ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('');
    }

    async function loadCategories() {
      categories = await api('GET', '/api/categories');
      document.getElementById('habitCat').innerHTML = catOptions(null);
      document.getElementById('catList').innerHTML = categories.map(c =>
        '<span class="pill" style="background:' + c.color + '55;margin:0 6px 6px 0">' + esc(c.name) +
        ' <a href="#" onclick="delCat(' + c.id + ');return false">&times;</a></span>').join('');
    }

    // Lucide line icons (drawn with currentColor)
    const ICON_GRIP = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></svg>';
    const ICON_PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>';

    let currentHabits = [];
    let sortState = { key: null, dir: 'asc' };   // which column the list was last sorted by

    // Clickable column headers: click to sort A-Z, click again for Z-A.
    function renderHead() {
      const th = (key, label) => {
        const on = sortState.key === key;
        const arrow = on ? (sortState.dir === 'asc' ? ' \u25B2' : ' \u25BC') : '';
        return '<th aria-sort="' + (on ? (sortState.dir === 'asc' ? 'ascending' : 'descending') : 'none') + '">' +
          '<button type="button" class="th-sort" onclick="sortBy(\'' + key + '\')">' + label + arrow + '</button></th>';
      };
      document.getElementById('habitHead').innerHTML =
        '<tr><th style="width:44px"></th>' + th('title', t('title')) + th('category', t('category')) + '<th></th></tr>';
    }

    // Sorts the habits and saves the result as the order (the Home page uses it too).
    // Pinned habits stay above the others; each group is sorted on its own.
    async function sortBy(key) {
      const dir = sortState.key === key && sortState.dir === 'asc' ? 'desc' : 'asc';
      const sign = dir === 'asc' ? 1 : -1;
      const collator = new Intl.Collator(currentLang, { sensitivity: 'base', numeric: true });
      const sorted = [...currentHabits].sort((a, b) => {
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        if (key === 'category') {
          if (!a.category_name !== !b.category_name) return a.category_name ? -1 : 1;   // no category: always last
          const c = collator.compare(a.category_name || '', b.category_name || '');
          return c ? sign * c : collator.compare(a.title, b.title);
        }
        return sign * collator.compare(a.title, b.title);
      });
      try {
        await api('PUT', '/api/habits/order', { year: ym.year, month: ym.month, ids: sorted.map(h => h.id) });
        sortState = { key, dir };
      } catch (err) { alert(err.message); }
      await loadHabits();
      renderHead();
    }

    async function loadHabits() {
      const data = await api('GET', '/api/habits?archived=1&year=' + ym.year + '&month=' + ym.month);
      currentHabits = data.habits;
      document.getElementById('habitRows').innerHTML = data.habits.map(h =>
        '<tr data-id="' + h.id + '" data-pinned="' + (h.pinned ? 1 : 0) + '" style="' + (h.archived ? 'opacity:.5' : '') + '">' +
        '<td class="handle-cell"><button type="button" class="card-icon row-handle" aria-label="' + t('dragHandle') + '" title="' + t('dragHandle') + '">' + ICON_GRIP + '</button></td>' +
        '<td><input value="' + esc(h.title) + '" onchange="rename(' + h.id + ', this.value)"></td>' +
        '<td><select onchange="recat(' + h.id + ', this.value)">' + catOptions(h.category_id) + '</select></td>' +
        '<td style="text-align:right">' +
          '<button type="button" class="card-icon pin-btn' + (h.pinned ? ' on' : '') + '" onclick="pin(' + h.id + ',' + !h.pinned + ')" aria-pressed="' + (h.pinned ? 'true' : 'false') + '" aria-label="' + (h.pinned ? t('unpinCard') : t('pinCard')) + '" title="' + (h.pinned ? t('unpinCard') : t('pinCard')) + '">' + ICON_PIN + '</button> ' +
          '<button onclick="archive(' + h.id + ',' + !h.archived + ')">' + (h.archived ? t('unarchive') : t('archive')) + '</button> ' +
          '<button class="danger" onclick="del(' + h.id + ')">' + t('delete') + '</button>' +
        '</td></tr>').join('');
    }

    async function pin(id, flag) { await api('PATCH', '/api/habits/' + id, { pinned: flag }); sortState = { key: null, dir: 'asc' }; renderHead(); loadHabits(); }
    async function rename(id, title) { if (title.trim()) await api('PATCH', '/api/habits/' + id, { title }); loadHabits(); }
    async function recat(id, v) { await api('PATCH', '/api/habits/' + id, { categoryId: v ? Number(v) : null }); }
    async function archive(id, flag) { await api('PATCH', '/api/habits/' + id, { archived: flag }); loadHabits(); }
    async function del(id) { if (confirm(t('confirmDelete'))) { await api('DELETE', '/api/habits/' + id); loadHabits(); } }
    async function delCat(id) { await api('DELETE', '/api/categories/' + id); await loadCategories(); loadHabits(); }

    document.getElementById('addCat').onclick = async () => {
      const name = document.getElementById('catName').value;
      if (!name.trim()) return;
      await api('POST', '/api/categories', { name, color: document.getElementById('catColor').value });
      document.getElementById('catName').value = '';
      await loadCategories(); loadHabits();
    };

    document.getElementById('addHabit').onclick = async () => {
      const title = document.getElementById('habitTitle').value;
      const cat = document.getElementById('habitCat').value;
      const msg = document.getElementById('habitMsg');
      if (!title.trim()) return;
      try {
        await api('POST', '/api/habits', { title, categoryId: cat ? Number(cat) : null, year: ym.year, month: ym.month });
        document.getElementById('habitTitle').value = '';
        msg.textContent = '';
        loadHabits();
      } catch (err) { msg.className = 'msg error'; msg.textContent = err.message; }
    };

    // ---- Copy habits from any month to any month ----
    function fillMonthYear(prefix, v) {
      const n = nowYM();
      let mo = '';
      I18N[currentLang].months.forEach((name, i) => {
        mo += '<option value="' + (i + 1) + '"' + (i + 1 === v.month ? ' selected' : '') + '>' + name + '</option>';
      });
      let yo = '';
      for (let y = Math.min(n.year - 5, v.year); y <= Math.max(n.year + 1, v.year); y++)
        yo += '<option value="' + y + '"' + (y === v.year ? ' selected' : '') + '>' + y + '</option>';
      document.getElementById(prefix + 'Month').innerHTML = mo;
      document.getElementById(prefix + 'Year').innerHTML = yo;
    }
    // Default: previous month copied into the month being managed
    function prefillCopy() {
      fillMonthYear('from', prevYM(ym.year, ym.month));
      fillMonthYear('to', ym);
    }

    document.getElementById('copyGo').onclick = async () => {
      const from = { year: Number(document.getElementById('fromYear').value), month: Number(document.getElementById('fromMonth').value) };
      const to = { year: Number(document.getElementById('toYear').value), month: Number(document.getElementById('toMonth').value) };
      const el = document.getElementById('copyMsg');
      if (from.year === to.year && from.month === to.month) {
        el.className = 'msg error'; el.textContent = t('sameMonth'); return;
      }
      try {
        const out = await api('POST', '/api/habits/copy', {
          fromYear: from.year, fromMonth: from.month, toYear: to.year, toMonth: to.month });
        el.className = 'msg ok';
        el.textContent = out.found === 0 ? t('noSourceHabits')
          : out.copied ? out.copied + ' ' + t('copied') : t('nothingToCopy');
        if (to.year === ym.year && to.month === ym.month) {
          loadHabits();
        } else if (out.copied) {
          el.innerHTML += ' <a href="#" id="goDest">' + t('viewMonth') + '</a>';
          document.getElementById('goDest').onclick = (e) => { e.preventDefault(); go(to); };
        }
      } catch (err) {
        el.className = 'msg error'; el.textContent = t('genericError');
      }
    };

    // ---- Reordering: drag a row by its handle (or Tab to the handle and use the arrow keys).
    // This is the same order the Home page uses. Pinned habits stay above the others,
    // so rows move within their own group; use the pin button to change group. ----
    const rowsEl = document.getElementById('habitRows');
    let dragRow = null;

    function saveOrder() {
      sortState = { key: null, dir: 'asc' };   // a manual move replaces any sort
      renderHead();
      const ids = [...rowsEl.querySelectorAll('tr')].map(r => Number(r.dataset.id));
      api('PUT', '/api/habits/order', { year: ym.year, month: ym.month, ids }).catch(() => loadHabits());
    }

    rowsEl.addEventListener('pointerdown', (e) => {
      const tr = e.target.closest('tr');
      if (tr) tr.draggable = !!e.target.closest('.row-handle');
    });
    rowsEl.addEventListener('dragstart', (e) => {
      const tr = e.target.closest('tr');
      if (!tr || !tr.draggable) { e.preventDefault(); return; }
      dragRow = tr;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', tr.dataset.id);   // Firefox needs some data
      setTimeout(() => tr.classList.add('dragging'), 0);
    });
    rowsEl.addEventListener('dragover', (e) => {
      if (!dragRow) return;
      const target = e.target.closest('tr');
      if (!target || target === dragRow || target.dataset.pinned !== dragRow.dataset.pinned) return;
      e.preventDefault();
      const r = target.getBoundingClientRect();
      rowsEl.insertBefore(dragRow, e.clientY < r.top + r.height / 2 ? target : target.nextSibling);
    });
    rowsEl.addEventListener('drop', (e) => { if (dragRow) e.preventDefault(); });
    rowsEl.addEventListener('dragend', () => {
      if (!dragRow) return;
      dragRow.classList.remove('dragging');
      dragRow.draggable = false;
      dragRow = null;
      saveOrder();
    });
    rowsEl.addEventListener('keydown', (e) => {
      const handle = e.target.closest('.row-handle');
      const step = { ArrowUp: -1, ArrowDown: 1 }[e.key];
      if (!handle || !step) return;
      e.preventDefault();
      const tr = handle.closest('tr');
      const sib = step < 0 ? tr.previousElementSibling : tr.nextElementSibling;
      if (!sib || sib.dataset.pinned !== tr.dataset.pinned) return;
      rowsEl.insertBefore(tr, step < 0 ? sib : sib.nextSibling);
      handle.focus();
      saveOrder();
    });

    function go(newYm) {
      ym = newYm;
      history.replaceState(null, '', '?year=' + ym.year + '&month=' + ym.month);
      renderPickers(document.getElementById('pickers'), ym, go);
      prefillCopy();
      loadHabits();
    }

    applyI18n();
    document.getElementById('sortHint').textContent = t('sortHint');
    renderHead();
    renderPickers(document.getElementById('pickers'), ym, go);
    prefillCopy();
    loadCategories().then(loadHabits);
  </script>
</body>
</html>
