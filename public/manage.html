<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage habits</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body>
  <header id="hdr"></header>
  <main>
    <div class="toolbar"><span id="pickers" class="toolbar" style="margin:0"></span></div>

    <div class="panel">
      <h2 data-i18n="category"></h2>
      <div class="form-row">
        <input id="catName" data-i18n-ph="category">
        <input id="catColor" type="color" value="#5b8def">
        <button class="primary" id="addCat" data-i18n="addCategory"></button>
      </div>
      <div id="catList"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="addHabit"></h2>
      <div class="form-row">
        <input id="habitTitle" data-i18n-ph="title">
        <select id="habitCat"></select>
        <button class="primary" id="addHabit" data-i18n="addHabit"></button>
      </div>
      <div id="habitMsg" class="msg"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="copyHabits"></h2>
      <div class="form-row">
        <label><span data-i18n="copyFrom"></span> <select id="fromMonth"></select> <select id="fromYear"></select></label>
        <span aria-hidden="true">&rarr;</span>
        <label><span data-i18n="copyTo"></span> <select id="toMonth"></select> <select id="toYear"></select></label>
        <button class="primary" id="copyGo" data-i18n="copyNow"></button>
      </div>
      <div id="copyMsg" class="msg"></div>
    </div>

    <div class="panel">
      <table>
        <thead><tr><th data-i18n="title"></th><th data-i18n="category"></th><th></th></tr></thead>
        <tbody id="habitRows"></tbody>
      </table>
    </div>
  </main>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
  <script>
    document.getElementById('hdr').innerHTML = headerHtml();
    let ym = getYM();
    let categories = [];

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function catOptions(selectedId) {
      return '<option value="">' + t('noCategory') + '</option>' + categories.map(c =>
        '<option value="' + c.id + '"' + (c.id === selectedId ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('');
    }

    async function loadCategories() {
      categories = await api('GET', '/api/categories');
      document.getElementById('habitCat').innerHTML = catOptions(null);
      document.getElementById('catList').innerHTML = categories.map(c =>
        '<span class="pill" style="background:' + c.color + '55;margin:0 6px 6px 0">' + esc(c.name) +
        ' <a href="#" onclick="delCat(' + c.id + ');return false">&times;</a></span>').join('');
    }

    async function loadHabits() {
      const data = await api('GET', '/api/habits?archived=1&year=' + ym.year + '&month=' + ym.month);
      document.getElementById('habitRows').innerHTML = data.habits.map(h =>
        '<tr style="' + (h.archived ? 'opacity:.5' : '') + '">' +
        '<td><input value="' + esc(h.title) + '" onchange="rename(' + h.id + ', this.value)"></td>' +
        '<td><select onchange="recat(' + h.id + ', this.value)">' + catOptions(h.category_id) + '</select></td>' +
        '<td style="text-align:right">' +
          '<button onclick="archive(' + h.id + ',' + !h.archived + ')">' + (h.archived ? t('unarchive') : t('archive')) + '</button> ' +
          '<button class="danger" onclick="del(' + h.id + ')">' + t('delete') + '</button>' +
        '</td></tr>').join('');
    }

    async function rename(id, title) { if (title.trim()) await api('PATCH', '/api/habits/' + id, { title }); loadHabits(); }
    async function recat(id, v) { await api('PATCH', '/api/habits/' + id, { categoryId: v ? Number(v) : null }); }
    async function archive(id, flag) { await api('PATCH', '/api/habits/' + id, { archived: flag }); loadHabits(); }
    async function del(id) { if (confirm(t('confirmDelete'))) { await api('DELETE', '/api/habits/' + id); loadHabits(); } }
    async function delCat(id) { await api('DELETE', '/api/categories/' + id); await loadCategories(); loadHabits(); }

    document.getElementById('addCat').onclick = async () => {
      const name = document.getElementById('catName').value;
      if (!name.trim()) return;
      await api('POST', '/api/categories', { name, color: document.getElementById('catColor').value });
      document.getElementById('catName').value = '';
      await loadCategories(); loadHabits();
    };

    document.getElementById('addHabit').onclick = async () => {
      const title = document.getElementById('habitTitle').value;
      const cat = document.getElementById('habitCat').value;
      const msg = document.getElementById('habitMsg');
      if (!title.trim()) return;
      try {
        await api('POST', '/api/habits', { title, categoryId: cat ? Number(cat) : null, year: ym.year, month: ym.month });
        document.getElementById('habitTitle').value = '';
        msg.textContent = '';
        loadHabits();
      } catch (err) { msg.className = 'msg error'; msg.textContent = err.message; }
    };

    // ---- Copy habits from any month to any month ----
    function fillMonthYear(prefix, v) {
      const n = nowYM();
      let mo = '';
      I18N[currentLang].months.forEach((name, i) => {
        mo += '<option value="' + (i + 1) + '"' + (i + 1 === v.month ? ' selected' : '') + '>' + name + '</option>';
      });
      let yo = '';
      for (let y = Math.min(n.year - 5, v.year); y <= Math.max(n.year + 1, v.year); y++)
        yo += '<option value="' + y + '"' + (y === v.year ? ' selected' : '') + '>' + y + '</option>';
      document.getElementById(prefix + 'Month').innerHTML = mo;
      document.getElementById(prefix + 'Year').innerHTML = yo;
    }
    // Default: previous month copied into the month being managed
    function prefillCopy() {
      fillMonthYear('from', prevYM(ym.year, ym.month));
      fillMonthYear('to', ym);
    }

    document.getElementById('copyGo').onclick = async () => {
      const from = { year: Number(document.getElementById('fromYear').value), month: Number(document.getElementById('fromMonth').value) };
      const to = { year: Number(document.getElementById('toYear').value), month: Number(document.getElementById('toMonth').value) };
      const el = document.getElementById('copyMsg');
      if (from.year === to.year && from.month === to.month) {
        el.className = 'msg error'; el.textContent = t('sameMonth'); return;
      }
      try {
        const out = await api('POST', '/api/habits/copy', {
          fromYear: from.year, fromMonth: from.month, toYear: to.year, toMonth: to.month });
        el.className = 'msg ok';
        el.textContent = out.found === 0 ? t('noSourceHabits')
          : out.copied ? out.copied + ' ' + t('copied') : t('nothingToCopy');
        if (to.year === ym.year && to.month === ym.month) {
          loadHabits();
        } else if (out.copied) {
          el.innerHTML += ' <a href="#" id="goDest">' + t('viewMonth') + '</a>';
          document.getElementById('goDest').onclick = (e) => { e.preventDefault(); go(to); };
        }
      } catch (err) {
        el.className = 'msg error'; el.textContent = t('genericError');
      }
    };

    function go(newYm) {
      ym = newYm;
      history.replaceState(null, '', '?year=' + ym.year + '&month=' + ym.month);
      renderPickers(document.getElementById('pickers'), ym, go);
      prefillCopy();
      loadHabits();
    }

    applyI18n();
    renderPickers(document.getElementById('pickers'), ym, go);
    prefillCopy();
    loadCategories().then(loadHabits);
  </script>
</body>
</html>
